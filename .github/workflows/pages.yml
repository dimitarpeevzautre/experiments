name: Deploy visualization to GitHub Pages

on:
  push:
    branches: [main, claude/3d-architectural-viz-8mwul5]
    paths: ['3d-architectural-viz/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 3d-architectural-viz
      - id: deployment
        uses: actions/deploy-pages@v4
