<title>Caroline · 40 × 60 Site</title>
<style>
  :root {
    --ink: #4a3526;
    --ink-soft: rgba(74, 53, 38, 0.72);
    --plate: rgba(250, 243, 231, 0.78);
    --plate-line: rgba(90, 60, 35, 0.35);
    --chip-bg: rgba(40, 30, 22, 0.42);
    --chip-ink: #f4e9d6;
    --chip-active: rgba(244, 233, 214, 0.92);
    --chip-active-ink: #3c2c1e;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    background:
      radial-gradient(120% 90% at 12% 8%, rgba(255, 214, 158, 0.95) 0%, rgba(255, 214, 158, 0) 55%),
      linear-gradient(112deg, #e9c9a2 0%, #ddc2a4 26%, #c9c2b0 52%, #b9c4c6 76%, #a9b6bd 100%);
  }
  #stage { position: fixed; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(115% 100% at 50% 42%, rgba(0,0,0,0) 58%, rgba(46, 34, 24, 0.28) 100%);
  }

  header {
    position: fixed; top: clamp(16px, 3vh, 34px); left: clamp(18px, 3vw, 40px);
    color: var(--ink); pointer-events: none; max-width: 44ch;
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.7rem, 3.4vw, 2.6rem);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-wrap: balance;
    color: #fdf6e9;
    text-shadow: 0 1px 14px rgba(120, 70, 30, 0.45), 0 1px 2px rgba(90, 50, 20, 0.4);
  }
  header h1 .dot { opacity: 0.65; padding: 0 0.25em; }
  header h1 .nowrap { white-space: nowrap; }
  header p {
    margin: 0.5em 0 0;
    font-size: clamp(0.72rem, 1.1vw, 0.85rem);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(253, 246, 233, 0.85);
    text-shadow: 0 1px 8px rgba(120, 70, 30, 0.5);
  }

  #legend {
    position: fixed; left: clamp(18px, 3vw, 40px); bottom: clamp(14px, 3vh, 30px);
    padding: 10px 16px;
    background: var(--plate);
    border: 1px solid var(--plate-line);
    border-radius: 3px;
    color: var(--ink-soft);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    pointer-events: none;
  }
  #legend strong { color: var(--ink); font-weight: 600; }

  nav {
    position: fixed; right: clamp(18px, 3vw, 40px); bottom: clamp(14px, 3vh, 30px);
    display: flex; flex-direction: column; align-items: flex-end; gap: 9px;
  }
  #compass-wrap {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    color: rgba(253, 246, 233, 0.9);
    font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(80, 50, 25, 0.55);
  }
  #compass { display: block; transform-origin: 50% 50%; filter: drop-shadow(0 1px 3px rgba(80, 50, 25, 0.5)); }
  nav button {
    font: inherit;
    font-size: 0.74rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--chip-ink);
    background: var(--chip-bg);
    border: 1px solid rgba(244, 233, 214, 0.35);
    border-radius: 2px;
    padding: 9px 18px;
    cursor: pointer;
    backdrop-filter: blur(3px);
    transition: background 0.25s ease, color 0.25s ease;
  }
  nav button:hover { background: rgba(40, 30, 22, 0.62); }
  nav button.active { background: var(--chip-active); color: var(--chip-active-ink); border-color: rgba(90, 60, 35, 0.4); }
  nav button:focus-visible { outline: 2px solid #fdf6e9; outline-offset: 2px; }

  @media (max-width: 640px) {
    #legend { display: none; }
    nav button { padding: 8px 12px; letter-spacing: 0.18em; }
    header { max-width: calc(100vw - 36px); }
    header h1 { font-size: 1.3rem; letter-spacing: 0.12em; }
    header p { font-size: 0.62rem; letter-spacing: 0.16em; }
  }
</style>

<div id="stage"><canvas id="scene"></canvas></div>
<div id="vignette"></div>

<header>
  <h1><span class="nowrap">CAROLINE</span><span class="dot">·</span><span class="nowrap">40 × 60 SITE</span></h1>
  <p>Timber cabin · natural pool · cherry grove · off-grid systems</p>
</header>

<div id="legend"><strong>Golden hour study</strong> &nbsp;—&nbsp; drag to orbit · right-drag to pan · scroll to zoom · double-click resets</div>

<nav aria-label="View controls">
  <div id="compass-wrap">
    <svg id="compass" width="22" height="22" viewBox="-11 -11 22 22" aria-hidden="true">
      <circle r="10" fill="none" stroke="rgba(253,246,233,0.4)" stroke-width="1"/>
      <path d="M0,-8.5 L2.4,1 L0,-1 L-2.4,1 Z" fill="#fdf6e9"/>
      <path d="M0,8.5 L2.4,-1 L0,1 L-2.4,-1 Z" fill="rgba(253,246,233,0.35)"/>
    </svg>
    N
  </div>
  <button id="chip-roof" type="button">Roof on</button>
  <button id="chip-xray" type="button">X-ray walls</button>
  <button id="chip-systems" type="button">Systems</button>
  <button id="chip-top" type="button">Top view</button>
</nav>

<script>{{THREE}}</script>
<script>{{SCENE}}</script>
